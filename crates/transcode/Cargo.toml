[package]
name = "disccraft-transcode"
description = "素材のデコード、変換、エンコード"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
disccraft-mpeg2venc.workspace = true
disccraft-photo.workspace = true
disccraft-sound.workspace = true
disccraft-motion.workspace = true
disccraft-psmux.workspace = true
disccraft-m2tsmux.workspace = true
# DV (M6.410): the media reader lists DV in an AVI but has no decoder for it.
disccraft-dv.workspace = true
# The AC-3 decoder: a raw .ac3 file is decoded for the monitor's sound and its waveform (never for the disc).
craft-audio = { workspace = true, features = ["ac3-decode"] }
craft-media.workspace = true
# Inflates the zlib-compressed subtitle tracks of a Matroska file (M6.422).
miniz_oxide.workspace = true
filmcraft-media.workspace = true
filmcraft-codecs.workspace = true
filmcraft-frame.workspace = true
filmcraft-color.workspace = true
filmcraft-time.workspace = true
craft-video = { workspace = true, features = ["h264-encode"] }
thiserror.workspace = true
rayon.workspace = true

[features]
# HEVC (H.265) for Ultra HD video (M12.43, M12.44): craft-video's HEVC encoder, and the hardware encoder's HEVC. Off
# by default (M12.45): left out of the published programs until the patent check of AGENTS.md rule 6; without it an
# HEVC transcode is refused. `cargo test -p disccraft-transcode --features hevc` runs its tests.
hevc = ["craft-video/hevc-encode"]

[lints]
workspace = true
