[package]
name = "disccraft-platform"
description = "ディスク書き込みの OS API（unsafe を許す唯一の crate）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
disccraft-transcode.workspace = true

# M12.39: the hardware H.264 encoders through Media Foundation (Microsoft's own bindings, MIT OR Apache-2.0; the
# workspace already has the crate through other dependencies). M9.35: disc writing through IMAPI2.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_Imapi",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Ole",
    "Win32_System_Variant",
    # M6.505: a long job's progress on the taskbar button, and its flash when the job ends.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# M9.35: `windows::core::implement` (the image as an IStream for IMAPI2) names this crate directly.
windows-core = "0.62"

# The workspace's lints, but `unsafe_code` denied instead of forbidden: this crate alone calls foreign functions
# (AGENTS.md rule 1), in modules that allow it, each `unsafe` with its `// SAFETY:`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
undocumented_unsafe_blocks = "deny"
