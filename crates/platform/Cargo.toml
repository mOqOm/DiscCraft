[package]
name = "disccraft-platform"
description = "ディスク書き込みの OS API（unsafe を許す唯一の crate）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]

# The workspace's lints, but `unsafe_code` denied instead of forbidden: this crate alone calls foreign functions
# (AGENTS.md rule 1), in modules that allow it, each `unsafe` with its `// SAFETY:`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
undocumented_unsafe_blocks = "deny"
