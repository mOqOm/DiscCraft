# Windows / macOS jobs will be added when runners are available.

# 自動ビルドは一旦止めている（2026-11-11）。push やマージリクエストではパイプラインを作らない。
# GitLab の「ビルド > パイプライン > パイプラインを実行」から手動でだけ動かせる。
# 自動に戻すときは、この workflow のブロックを消す（下の ci ジョブはそのまま使える）。
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

stages:
  - test

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"

cache:
  key:
    files:
      - Cargo.lock
  paths:
    - .cargo-home/registry
    - .cargo-home/git
    - target/

ci:
  stage: test
  image: rust:latest
  before_script:
    - rustup component add clippy rustfmt
  script:
    - cargo xtask ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
