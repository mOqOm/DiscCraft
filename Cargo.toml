[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# FilmCraft に合わせる
rust-version = "1.95"
repository = "https://github.com/mOqOm/DiscCraft"
publish = false

[workspace.dependencies]
disccraft-mpeg2venc = { path = "crates/mpeg2venc" }
disccraft-ac3enc = { path = "crates/ac3enc" }
disccraft-psmux = { path = "crates/psmux" }
disccraft-spu = { path = "crates/spu" }
disccraft-ifo = { path = "crates/ifo" }
disccraft-m2tsmux = { path = "crates/m2tsmux" }
disccraft-bdmv = { path = "crates/bdmv" }
disccraft-pgs = { path = "crates/pgs" }
disccraft-udf = { path = "crates/udf" }
disccraft-project = { path = "crates/project" }
disccraft-vm = { path = "crates/vm" }
disccraft-menu = { path = "crates/menu" }
disccraft-nav = { path = "crates/nav" }
disccraft-transcode = { path = "crates/transcode" }
disccraft-check = { path = "crates/check" }
disccraft-dvd = { path = "crates/dvd" }
disccraft-bd = { path = "crates/bd" }
disccraft-photo = { path = "crates/photo" }
disccraft-motion = { path = "crates/motion" }
disccraft-sound = { path = "crates/sound" }
disccraft-film = { path = "crates/film" }
disccraft-build = { path = "crates/build" }
disccraft-engine = { path = "crates/engine" }
disccraft-ui-egui = { path = "crates/ui-egui" }
disccraft-automation = { path = "crates/automation" }
disccraft-platform = { path = "crates/platform" }

# 外部 crate
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
png = "0.17"
# Subtitle files in Shift_JIS / UTF-16 ((Apache-2.0 OR MIT) AND BSD-3-Clause; already in the tree).
encoding_rs = "0.8"
# SVG rendering (MPL-2.0, used unmodified).
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }
egui = "0.37"
eframe = "0.37"
rfd = "0.18"
# The operating system's display language, for the interface language at startup.
sys-locale = "0.3"
cpal = "0.18.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# FilmCraft（MIT OR Apache-2.0）。crates.io 未公開のため git 依存で rev を固定する。
# 帰属は NOTICE。
filmcraft-time = { git = "https://github.com/storytold/filmcraft", rev = "93a88a839aae370740b09434fdec410abb8c24ca" }
filmcraft-geom = { git = "https://github.com/storytold/filmcraft", rev = "93a88a839aae370740b09434fdec410abb8c24ca" }
filmcraft-color = { git = "https://github.com/storytold/filmcraft", rev = "93a88a839aae370740b09434fdec410abb8c24ca" }
filmcraft-bitstream = { git = "https://github.com/storytold/filmcraft", rev = "93a88a839aae370740b09434fdec410abb8c24ca" }
filmcraft-frame = { git = "https://github.com/storytold/filmcraft", rev = "93a88a839aae370740b09434fdec410abb8c24ca" }
filmcraft-media = { git = "https://github.com/storytold/filmcraft", rev = "93a88a839aae370740b09434fdec410abb8c24ca" }
filmcraft-text = { git = "https://github.com/storytold/filmcraft", rev = "93a88a839aae370740b09434fdec410abb8c24ca" }
filmcraft-audio-dsp = { git = "https://github.com/storytold/filmcraft", rev = "93a88a839aae370740b09434fdec410abb8c24ca" }
filmcraft-codecs = { git = "https://github.com/storytold/filmcraft", rev = "93a88a839aae370740b09434fdec410abb8c24ca" }
# FilmCraft's project model and file format: DiscCraft reads a project's sequences and markers (chapters).
filmcraft-project = { git = "https://github.com/storytold/filmcraft", rev = "93a88a839aae370740b09434fdec410abb8c24ca" }
filmcraft-format = { git = "https://github.com/storytold/filmcraft", rev = "93a88a839aae370740b09434fdec410abb8c24ca" }
# craft-libs (MIT OR Apache-2.0), the revision FilmCraft uses for its codecs: the H.264 encoder (feature `h264-encode`,
# FilmCraft's former filmcraft-h264enc) makes the HD Blu-ray video, and the MPEG-2 decoder (`mpeg2-decode`) checks our
# encoder in tests. Each crate turns on the feature it needs.
craft-video = { git = "https://github.com/storytold/craft-libs", rev = "82062077bba679ba5236e2d1a391f02d1533cbab", default-features = false }
# craft-libs' AC-3 encoder (ETSI TS 102 366), the same revision: the transcoded soundtracks become Dolby Digital, as
# Encore makes them. Used through its public API only.
craft-audio = { git = "https://github.com/storytold/craft-libs", rev = "82062077bba679ba5236e2d1a391f02d1533cbab", default-features = false, features = ["ac3-encode"] }
# craft-libs' MPEG-2 Systems demuxer, the same revision: program and transport streams whose MPEG-2 video and AC-3
# can go on a DVD as they are are demuxed, not transcoded.
craft-media = { git = "https://github.com/storytold/craft-libs", rev = "82062077bba679ba5236e2d1a391f02d1533cbab", default-features = false, features = ["mpegts", "matroska", "isobmff"] }
# craft-libs' shared UI (MIT OR Apache-2.0), the revision FilmCraft uses: its docking (tab groups that are dragged,
# split, floated and closed, saved as workspaces), as the other Craft apps arrange their panels.
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "47107f660191de2f0b425569506f4daa4faadac9", features = ["serde"] }
photocraft-io = { git = "https://github.com/storytold/photocraft", rev = "01b79958a7b73c3d840b76492069e9635f9f7394" }
photocraft-doc = { git = "https://github.com/storytold/photocraft", rev = "01b79958a7b73c3d840b76492069e9635f9f7394" }
photocraft-compose = { git = "https://github.com/storytold/photocraft", rev = "01b79958a7b73c3d840b76492069e9635f9f7394" }
photocraft-geom = { git = "https://github.com/storytold/photocraft", rev = "01b79958a7b73c3d840b76492069e9635f9f7394" }
photocraft-raster = { git = "https://github.com/storytold/photocraft", rev = "01b79958a7b73c3d840b76492069e9635f9f7394" }
# PhotoCraft's PSD writer moved to craft-libs: the revision PhotoCraft uses, for writing test PSDs.
craft-psd = { git = "https://github.com/storytold/craft-libs", rev = "eafb50aff3c6b1acc14dff53060157877e3e4fce" }
# EffectCraft's engine and its headless session: a project's composition is rendered to a movie through its own
# render queue (disccraft-motion).
effectcraft-engine = { git = "https://github.com/storytold/effectcraft", rev = "4c38f78307e21a07021333c8a109e6fc49d66c3b" }
effectcraft-host = { git = "https://github.com/storytold/effectcraft", rev = "4c38f78307e21a07021333c8a109e6fc49d66c3b" }
soundcraft-engine = { git = "https://github.com/storytold/soundcraft", rev = "b47a58653c291f320179d20db3eafb40e70b88a7" }
soundcraft-dsp = { git = "https://github.com/storytold/soundcraft", rev = "b47a58653c291f320179d20db3eafb40e70b88a7" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

# craft-pdf (pulled in by PhotoCraft and EffectCraft) uses craft-libs' vendored Hayro trees; consumers patch the same
# craft-libs revision (craft-libs crates/pdf README): the one PhotoCraft uses (EffectCraft patches an older one).
[patch.crates-io]
hayro = { git = "https://github.com/storytold/craft-libs", rev = "fe6b443acf3eccaf514064812e6e6bf24257652a" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "fe6b443acf3eccaf514064812e6e6bf24257652a" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "fe6b443acf3eccaf514064812e6e6bf24257652a" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "fe6b443acf3eccaf514064812e6e6bf24257652a" }
# The Craft suite's egui and winit (the same reviewed fork commits as FilmCraft and the other Craft apps), so the
# suite's shared UI crates (craft-libs) and the UI ported from them work here as there.
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

# 開発ビルド（テスト、CLI での確かめ）でも、映像・音声の変換、多重化、描画の重いクレートは最適化する。
# 最適化なしでは何十倍も遅い（デバッグビルドで 20 秒の MP4 の DVD への変換に 444 秒）。最初のコンパイルだけ長くなる。
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.disccraft-mpeg2venc]
opt-level = 3

[profile.dev.package.disccraft-ac3enc]
opt-level = 3

[profile.dev.package.disccraft-transcode]
opt-level = 3

[profile.dev.package.disccraft-psmux]
opt-level = 3

[profile.dev.package.disccraft-m2tsmux]
opt-level = 3

[profile.dev.package.disccraft-spu]
opt-level = 3

[profile.dev.package.disccraft-pgs]
opt-level = 3

[profile.dev.package.disccraft-menu]
opt-level = 3

[profile.dev.package.disccraft-photo]
opt-level = 3

[profile.dev.package.disccraft-udf]
opt-level = 3
