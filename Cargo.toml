[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# FilmCraft に合わせる
rust-version = "1.95"
repository = "https://github.com/mOqOm/DiscCraft"
publish = false

[workspace.dependencies]
# A shared pool of worker threads for the work on each picture (M6.499): several transcodes side by side share the
# CPU's threads instead of each starting new ones for every picture. Already in the tree through EffectCraft.
rayon = "1.12"
# The programs' allocator (M6.500, MIT): big buffers freed and asked for again are reused from its own pages, not fresh
# ones from the system each time.
mimalloc = { version = "0.1", default-features = false }
disccraft-mpeg2venc = { path = "crates/mpeg2venc" }
disccraft-ac3enc = { path = "crates/ac3enc" }
disccraft-psmux = { path = "crates/psmux" }
disccraft-spu = { path = "crates/spu" }
disccraft-ifo = { path = "crates/ifo" }
disccraft-m2tsmux = { path = "crates/m2tsmux" }
disccraft-bdmv = { path = "crates/bdmv" }
disccraft-pgs = { path = "crates/pgs" }
disccraft-udf = { path = "crates/udf" }
disccraft-ddp = { path = "crates/ddp" }
disccraft-dv = { path = "crates/dv" }
disccraft-ffv1 = { path = "crates/ffv1" }
disccraft-h263 = { path = "crates/h263" }
disccraft-project = { path = "crates/project" }
disccraft-vm = { path = "crates/vm" }
disccraft-menu = { path = "crates/menu" }
disccraft-nav = { path = "crates/nav" }
disccraft-transcode = { path = "crates/transcode" }
disccraft-check = { path = "crates/check" }
disccraft-dvd = { path = "crates/dvd" }
disccraft-bd = { path = "crates/bd" }
disccraft-photo = { path = "crates/photo" }
disccraft-motion = { path = "crates/motion" }
disccraft-sound = { path = "crates/sound" }
disccraft-film = { path = "crates/film" }
disccraft-build = { path = "crates/build" }
disccraft-engine = { path = "crates/engine" }
disccraft-ui-egui = { path = "crates/ui-egui" }
disccraft-automation = { path = "crates/automation" }
disccraft-platform = { path = "crates/platform" }
# The tests' ffmpeg / ffprobe and fixture folder (M9.67). A dev-dependency only.
disccraft-test-support = { path = "crates/test-support" }

# 外部 crate
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
png = "0.18"
# The Windows program file's icon resource (apps/disccraft/build.rs). MIT.
winresource = "0.1"
# A font's PostScript name for a menu's type layers in a PSD (MIT OR Apache-2.0; the version FilmCraft's text uses,
# already in the tree).
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# Subtitle files in Shift_JIS / UTF-16 ((Apache-2.0 OR MIT) AND BSD-3-Clause; already in the tree).
encoding_rs = "0.8"
# zlib (M6.422: Matroska tracks stored compressed). Already in the tree through png.
miniz_oxide = "0.8"
# SVG rendering (MPL-2.0, used unmodified).
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "raster-images"] }
# "experimental" only makes egui's widget themes public: Encore's light text fields are one (M6.465).
egui = { version = "0.37", features = ["experimental"] }
eframe = "0.37"
# The operating system's display language, for the interface language at startup.
sys-locale = "0.3"
cpal = "0.18.2"
# XMP packets (the Metadata panel): a read-only XML tree, MIT OR Apache-2.0, already in the tree through the Craft crates.
roxmltree = "0.21"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# FilmCraft（MIT OR Apache-2.0）。crates.io 未公開のため git 依存で rev を固定する。
# 帰属は NOTICE。
filmcraft-time = { git = "https://github.com/storytold/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-geom = { git = "https://github.com/storytold/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-color = { git = "https://github.com/storytold/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-bitstream = { git = "https://github.com/storytold/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-frame = { git = "https://github.com/storytold/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-media = { git = "https://github.com/storytold/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-text = { git = "https://github.com/storytold/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-audio-dsp = { git = "https://github.com/storytold/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-codecs = { git = "https://github.com/storytold/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
# FilmCraft's project model and file format: DiscCraft reads a project's sequences and markers (chapters).
filmcraft-project = { git = "https://github.com/storytold/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-format = { git = "https://github.com/storytold/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
# craft-libs (MIT OR Apache-2.0), at its HEAD (the Craft apps keep it there): the H.264 encoder (feature `h264-encode`,
# FilmCraft's former filmcraft-h264enc) makes the HD Blu-ray video, and the MPEG-2 decoder (`mpeg2-decode`) checks our
# encoder in tests. Each crate turns on the feature it needs.
craft-video = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc", default-features = false }
# craft-libs' AC-3 encoder (ETSI TS 102 366), the same revision: the transcoded soundtracks become Dolby Digital, as
# Encore makes them. Used through its public API only.
craft-audio = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc", default-features = false, features = ["ac3-encode"] }
# craft-libs' MPEG-2 Systems demuxer, the same revision: program and transport streams whose MPEG-2 video and AC-3
# can go on a DVD as they are are demuxed, not transcoded.
craft-media = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc", default-features = false, features = ["mpegts", "matroska", "isobmff"] }
# craft-libs' shared UI (MIT OR Apache-2.0), the same revision: its docking (tab groups that are dragged,
# split, floated and closed, saved as workspaces), as the other Craft apps arrange their panels.
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc" }
# craft-libs' font embedding (MIT OR Apache-2.0), the same revision: ui-egui's build script embeds the craft-fonts faces
# (OFL-1.1) a build is given in CRAFT_FONTS_DIR, which craft-ui's font stack puts under Encore's faces (M9.66).
craft-fonts-build = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc" }
# craft-libs' translations (MIT OR Apache-2.0), the same revision: the lookup the Crafting Apps share (app rows over
# craft-i18n's shared catalog, then English), over the catalogs in crates/ui-egui/i18n (M16.1).
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc" }
# craft-libs' menus (MIT OR Apache-2.0), the same revision: the menu bar the Crafting Apps share (its layouts for
# Windows, Linux and macOS, keyboard access, mnemonics), with craft-keymap's chords for its shortcuts (M16.4).
craft-menu = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc" }
craft-keymap = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc", features = ["egui"] }
# The UI runtime craft-ui and craft-menu are built on (M9.54): the dock model (craft-behavior), the app's host
# (craft-host: its name, words and language for the framework's own words), the window services the runtime is
# installed with (craft-window) and the theme mode (craft-theme). The same revision.
craft-behavior = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc" }
craft-host = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc" }
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc" }
craft-theme = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc" }
photocraft-io = { git = "https://github.com/storytold/photocraft", rev = "391cb0171004a5cb6b7b5138ac96c1ceb5ed8ae1" }
photocraft-doc = { git = "https://github.com/storytold/photocraft", rev = "391cb0171004a5cb6b7b5138ac96c1ceb5ed8ae1" }
photocraft-compose = { git = "https://github.com/storytold/photocraft", rev = "391cb0171004a5cb6b7b5138ac96c1ceb5ed8ae1" }
photocraft-geom = { git = "https://github.com/storytold/photocraft", rev = "391cb0171004a5cb6b7b5138ac96c1ceb5ed8ae1" }
photocraft-raster = { git = "https://github.com/storytold/photocraft", rev = "391cb0171004a5cb6b7b5138ac96c1ceb5ed8ae1" }
# PhotoCraft's PSD writer moved to craft-libs: the same revision, for writing test PSDs.
craft-psd = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc" }
# craft-libs' caption files (MIT OR Apache-2.0), the same revision: the subtitle formats DiscCraft does not read
# itself (M6.566: ASS / SSA, Scenarist SCC, MacCaption MCC, EBU STL, TTML / DFXP, SAMI).
craft-captions = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc" }
# craft-libs' MCP server machinery (MIT OR Apache-2.0), the same revision: JSON-RPC 2.0 over stdio, the MCP lifecycle
# and the tool argument checks the Craft apps share, behind `disccraft-cli mcp` (M9.61).
craft-mcp-server = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc" }
# craft-libs' file signatures (MIT OR Apache-2.0), the same revision: an imported file's kind from its first bytes
# where they name a format DiscCraft reads (M6.568), its name otherwise.
craft-sniff = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc" }
# craft-libs' settings storage (MIT OR Apache-2.0), the same revision: DiscCraft's settings in a config.toml with
# atomic saves, a backup, damaged-file recovery and schema migration, as the other Craft apps keep theirs (M9.62).
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc" }
# craft-libs' file dialogs (MIT OR Apache-2.0), the same revision: native file dialogs that never hold up a frame,
# asked for with what comes after them and answered on a later frame, as the other Craft apps show theirs (M9.64).
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc" }
# craft-libs' updater (MIT OR Apache-2.0), the same revision: Help ▸ Check for Updates… asks GitHub for the newest
# release and installs it (MSI, portable ZIP, AppImage…), with the update dialogs the other Craft apps show (M9.65).
craft-update = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc", features = ["ui"] }
# craft-libs' oracle-test support (MIT OR Apache-2.0), the same revision: where ffmpeg and ffprobe are for the tests
# that compare with them, through disccraft-test-support (M9.67). Tests only.
craft-media-testkit = { git = "https://github.com/storytold/craft-libs", rev = "6bfe8e7678dd470432b949154e78ec1f92fc64fc" }
# EffectCraft's engine and its headless session: a project's composition is rendered to a movie through its own
# render queue (disccraft-motion).
effectcraft-engine = { git = "https://github.com/storytold/effectcraft", rev = "1855d02c4727be0eea58f87a5ad5dc4ecdfd30a3" }
effectcraft-host = { git = "https://github.com/storytold/effectcraft", rev = "1855d02c4727be0eea58f87a5ad5dc4ecdfd30a3" }
soundcraft-engine = { git = "https://github.com/storytold/soundcraft", rev = "0fce3e7aba3943b837d588637b713a660a911a87" }
soundcraft-dsp = { git = "https://github.com/storytold/soundcraft", rev = "0fce3e7aba3943b837d588637b713a660a911a87" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

# craft-video from the mOqOm fork of craft-libs (branch `disccraft`: the pinned revision with storytold/craft-libs
# PRs #1992 and #2017, H.264 field pictures and MBAFF, not merged yet): every craft-video in the graph (DiscCraft's
# and the Craft apps' media readers) decodes interlaced H.264 (camcorder and broadcast 1080i). Back to the storytold
# revision once those PRs are merged.
[patch."https://github.com/storytold/craft-libs"]
craft-video = { git = "https://github.com/mOqOm/craft-libs", rev = "02468c886acc84fc04fd9285f57e11e544a98657" }
craft-media = { git = "https://github.com/mOqOm/craft-libs", rev = "02468c886acc84fc04fd9285f57e11e544a98657" }

# craft-pdf (pulled in by PhotoCraft and EffectCraft) uses craft-libs' vendored Hayro trees (and the vello and
# linesweeper crates they draw with); consumers patch the same craft-libs revision (craft-libs crates/pdf README): the one
# PhotoCraft's HEAD uses, for those of its crates that are in DiscCraft's graph.
[patch.crates-io]
hayro = { git = "https://github.com/storytold/craft-libs", rev = "3eb5b528b08211844bc5c95c5a4fd169894d52ff" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "3eb5b528b08211844bc5c95c5a4fd169894d52ff" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "3eb5b528b08211844bc5c95c5a4fd169894d52ff" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "3eb5b528b08211844bc5c95c5a4fd169894d52ff" }
linesweeper = { git = "https://github.com/storytold/craft-libs", rev = "3eb5b528b08211844bc5c95c5a4fd169894d52ff" }
vello_common = { git = "https://github.com/storytold/craft-libs", rev = "3eb5b528b08211844bc5c95c5a4fd169894d52ff" }
vello_cpu = { git = "https://github.com/storytold/craft-libs", rev = "3eb5b528b08211844bc5c95c5a4fd169894d52ff" }
# The Craft suite's egui and winit (the same reviewed fork commits as FilmCraft and the other Craft apps), so the
# suite's shared UI crates (craft-libs) and the UI ported from them work here as there.
ecolor = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
emath = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
egui = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "932a73b28560acb1a695533307b2cd0d66a42081" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

# 開発ビルドとテストのデバッグ情報は行番号だけ（M6.353）。完全なデバッグ情報ではテストの実行ファイル 1 つの PDB が
# 約 2 GB になり、16 並列のリンクがそれぞれ 11 GB を使ってメモリ（コミット 149 GB）を使い切っていた。バックトレースの
# ファイルと行は残る。
[profile.dev]
debug = "line-tables-only"

# 開発ビルド（テスト、CLI での確かめ）でも、映像・音声の変換、多重化、描画の重いクレートは最適化する。
# 最適化なしでは何十倍も遅い（デバッグビルドで 20 秒の MP4 の DVD への変換に 444 秒）。最初のコンパイルだけ長くなる。
# 依存クレートにはデバッグ情報を付けない。
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev.package.disccraft-mpeg2venc]
opt-level = 3

[profile.dev.package.disccraft-ac3enc]
opt-level = 3

[profile.dev.package.disccraft-transcode]
opt-level = 3

[profile.dev.package.disccraft-psmux]
opt-level = 3

[profile.dev.package.disccraft-m2tsmux]
opt-level = 3

[profile.dev.package.disccraft-spu]
opt-level = 3

[profile.dev.package.disccraft-pgs]
opt-level = 3

[profile.dev.package.disccraft-menu]
opt-level = 3

[profile.dev.package.disccraft-photo]
opt-level = 3

[profile.dev.package.disccraft-udf]
opt-level = 3
