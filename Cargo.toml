[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# FilmCraft に合わせる
rust-version = "1.95"
repository = "https://github.com/mOqOm/DiscCraft"
publish = false

[workspace.dependencies]
disccraft-mpeg2venc = { path = "crates/mpeg2venc" }
disccraft-ac3enc = { path = "crates/ac3enc" }
disccraft-psmux = { path = "crates/psmux" }
disccraft-spu = { path = "crates/spu" }
disccraft-ifo = { path = "crates/ifo" }
disccraft-m2tsmux = { path = "crates/m2tsmux" }
disccraft-bdmv = { path = "crates/bdmv" }
disccraft-pgs = { path = "crates/pgs" }
disccraft-udf = { path = "crates/udf" }
disccraft-project = { path = "crates/project" }
disccraft-vm = { path = "crates/vm" }
disccraft-menu = { path = "crates/menu" }
disccraft-nav = { path = "crates/nav" }
disccraft-transcode = { path = "crates/transcode" }
disccraft-check = { path = "crates/check" }
disccraft-dvd = { path = "crates/dvd" }
disccraft-bd = { path = "crates/bd" }
disccraft-photo = { path = "crates/photo" }
disccraft-motion = { path = "crates/motion" }
disccraft-sound = { path = "crates/sound" }
disccraft-build = { path = "crates/build" }
disccraft-engine = { path = "crates/engine" }
disccraft-ui-egui = { path = "crates/ui-egui" }
disccraft-automation = { path = "crates/automation" }
disccraft-platform = { path = "crates/platform" }

# 外部 crate
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
png = "0.17"
# Subtitle files in Shift_JIS / UTF-16 ((Apache-2.0 OR MIT) AND BSD-3-Clause; already in the tree).
encoding_rs = "0.8"
# SVG rendering (MPL-2.0, used unmodified).
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }
egui = "0.37"
eframe = "0.37"
rfd = "0.18"
cpal = "0.18.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# FilmCraft（MIT OR Apache-2.0）。crates.io 未公開のため git 依存で rev を固定する。
# 帰属は NOTICE。
filmcraft-time = { git = "https://github.com/storytold/filmcraft", rev = "19d46c0748cf5c0ef5b0b2a421b85e8ae6d99db6" }
filmcraft-geom = { git = "https://github.com/storytold/filmcraft", rev = "19d46c0748cf5c0ef5b0b2a421b85e8ae6d99db6" }
filmcraft-color = { git = "https://github.com/storytold/filmcraft", rev = "19d46c0748cf5c0ef5b0b2a421b85e8ae6d99db6" }
filmcraft-bitstream = { git = "https://github.com/storytold/filmcraft", rev = "19d46c0748cf5c0ef5b0b2a421b85e8ae6d99db6" }
filmcraft-h264enc = { git = "https://github.com/storytold/filmcraft", rev = "19d46c0748cf5c0ef5b0b2a421b85e8ae6d99db6" }
filmcraft-frame = { git = "https://github.com/storytold/filmcraft", rev = "19d46c0748cf5c0ef5b0b2a421b85e8ae6d99db6" }
filmcraft-media = { git = "https://github.com/storytold/filmcraft", rev = "19d46c0748cf5c0ef5b0b2a421b85e8ae6d99db6" }
filmcraft-text = { git = "https://github.com/storytold/filmcraft", rev = "19d46c0748cf5c0ef5b0b2a421b85e8ae6d99db6" }
filmcraft-audio-dsp = { git = "https://github.com/storytold/filmcraft", rev = "19d46c0748cf5c0ef5b0b2a421b85e8ae6d99db6" }
filmcraft-codecs = { git = "https://github.com/storytold/filmcraft", rev = "19d46c0748cf5c0ef5b0b2a421b85e8ae6d99db6" }
# craft-libs (MIT OR Apache-2.0), the revision FilmCraft uses: its MPEG-2 decoder checks our encoder in tests.
craft-video = { git = "https://github.com/storytold/craft-libs", rev = "47107f660191de2f0b425569506f4daa4faadac9", default-features = false, features = ["mpeg2"] }
# craft-libs' AC-3 encoder (ETSI TS 102 366), the same revision: the transcoded soundtracks become Dolby Digital, as
# Encore makes them. Used through its public API only.
craft-audio = { git = "https://github.com/storytold/craft-libs", rev = "47107f660191de2f0b425569506f4daa4faadac9", default-features = false, features = ["ac3-encode"] }
# craft-libs' shared UI (MIT OR Apache-2.0), the revision FilmCraft uses: its docking (tab groups that are dragged,
# split, floated and closed, saved as workspaces), as the other Craft apps arrange their panels.
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "47107f660191de2f0b425569506f4daa4faadac9", features = ["serde"] }
photocraft-io = { git = "https://github.com/storytold/photocraft", rev = "0fb40c534a8f2ca2e1aa6182f7ab06ae9fbed32e" }
photocraft-doc = { git = "https://github.com/storytold/photocraft", rev = "0fb40c534a8f2ca2e1aa6182f7ab06ae9fbed32e" }
photocraft-compose = { git = "https://github.com/storytold/photocraft", rev = "0fb40c534a8f2ca2e1aa6182f7ab06ae9fbed32e" }
photocraft-geom = { git = "https://github.com/storytold/photocraft", rev = "0fb40c534a8f2ca2e1aa6182f7ab06ae9fbed32e" }
photocraft-raster = { git = "https://github.com/storytold/photocraft", rev = "0fb40c534a8f2ca2e1aa6182f7ab06ae9fbed32e" }
# PhotoCraft's PSD writer moved to craft-libs: the revision PhotoCraft uses, for writing test PSDs.
craft-psd = { git = "https://github.com/storytold/craft-libs", rev = "09dcbc225b95232998498a40ca56e24716571d53" }
effectcraft-project = { git = "https://github.com/storytold/effectcraft", rev = "69bce0ec66f4cb2b9a169b6a19f4d2363faadad3" }
effectcraft-render = { git = "https://github.com/storytold/effectcraft", rev = "69bce0ec66f4cb2b9a169b6a19f4d2363faadad3" }
effectcraft-media = { git = "https://github.com/storytold/effectcraft", rev = "69bce0ec66f4cb2b9a169b6a19f4d2363faadad3" }
effectcraft-time = { git = "https://github.com/storytold/effectcraft", rev = "69bce0ec66f4cb2b9a169b6a19f4d2363faadad3" }
effectcraft-raster = { git = "https://github.com/storytold/effectcraft", rev = "69bce0ec66f4cb2b9a169b6a19f4d2363faadad3" }
soundcraft-engine = { git = "https://github.com/storytold/soundcraft", rev = "1775ce506103248e96886c502c582ee7047e9c26" }
soundcraft-dsp = { git = "https://github.com/storytold/soundcraft", rev = "1775ce506103248e96886c502c582ee7047e9c26" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

# craft-pdf (pulled in by PhotoCraft and EffectCraft) uses craft-libs' vendored Hayro trees; consumers patch the same
# craft-libs revision (craft-libs crates/pdf README): the one FilmCraft and EffectCraft use.
[patch.crates-io]
hayro = { git = "https://github.com/storytold/craft-libs", rev = "47107f660191de2f0b425569506f4daa4faadac9" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "47107f660191de2f0b425569506f4daa4faadac9" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "47107f660191de2f0b425569506f4daa4faadac9" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "47107f660191de2f0b425569506f4daa4faadac9" }
# The Craft suite's egui and winit (the same reviewed fork commits as FilmCraft and the other Craft apps), so the
# suite's shared UI crates (craft-libs) and the UI ported from them work here as there.
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

# 開発ビルド（テスト、CLI での確かめ）でも、映像・音声の変換、多重化、描画の重いクレートは最適化する。
# 最適化なしでは何十倍も遅い（デバッグビルドで 20 秒の MP4 の DVD への変換に 444 秒）。最初のコンパイルだけ長くなる。
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.disccraft-mpeg2venc]
opt-level = 3

[profile.dev.package.disccraft-ac3enc]
opt-level = 3

[profile.dev.package.disccraft-transcode]
opt-level = 3

[profile.dev.package.disccraft-psmux]
opt-level = 3

[profile.dev.package.disccraft-m2tsmux]
opt-level = 3

[profile.dev.package.disccraft-spu]
opt-level = 3

[profile.dev.package.disccraft-pgs]
opt-level = 3

[profile.dev.package.disccraft-menu]
opt-level = 3

[profile.dev.package.disccraft-photo]
opt-level = 3

[profile.dev.package.disccraft-udf]
opt-level = 3
