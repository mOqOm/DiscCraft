name: Release builds

# Builds DiscCraft for Linux and macOS on GitHub's runners and adds the packages to a release. The Windows
# executables of a release are built and checked by hand; these packages are built here only and have not been
# run by anyone (the README says so).
#
# - Run it by hand (Actions ▸ Release builds ▸ Run workflow) with the release's tag: the tag is checked out, built,
#   and the packages are uploaded to that release.
# - A push to a branch named release-test/... is a dry run: the branch is built and the packages are kept as the
#   run's artifacts, and no release is touched.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload to, e.g. v0.1.0-alpha.5"
        required: true
        type: string
  push:
    branches: ["release-test/**"]

permissions:
  contents: write

concurrency:
  group: release-builds-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu the runners have, so the programs start on systems with an older C library too.
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: linux-aarch64
            os: ubuntu-22.04-arm
          - name: macos-universal
            os: macos-latest
    env:
      TAG: ${{ inputs.tag }}
      CARGO_TERM_COLOR: always
    steps:
      # Actions are named by commit, so a moved tag cannot change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev \
            libfreetype-dev

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Names
        shell: bash
        run: |
          # The version in the package names: the tag without its "v" (a dry run has none).
          version="${TAG#v}"
          echo "VERSION=${version:-test}" >> "$GITHUB_ENV"
          # What the programs say they are (Help ▸ Check for Updates…, About).
          echo "DISCCRAFT_RELEASE=${TAG}" >> "$GITHUB_ENV"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked -p disccraft -p disccraft-cli
          mkdir -p dist
          cp target/release/disccraft target/release/disccraft-cli dist/

      - name: Build (macOS, Apple silicon and Intel in one)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" -p disccraft -p disccraft-cli
          done
          mkdir -p dist
          for program in disccraft disccraft-cli; do
            lipo -create -output "dist/$program" \
              "target/aarch64-apple-darwin/release/$program" "target/x86_64-apple-darwin/release/$program"
            lipo -info "dist/$program"
          done

      - name: Package
        shell: bash
        run: |
          folder="disccraft-${VERSION}-${{ matrix.name }}"
          mkdir "$folder"
          cp dist/disccraft dist/disccraft-cli "$folder/"
          cp README.md README.ja.md LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md "$folder/"
          # The program starts on the machine that built it.
          "$folder/disccraft-cli" commands > /dev/null
          if [ "${{ runner.os }}" = "macOS" ]; then
            zip -r -y "$folder.zip" "$folder"
            echo "PACKAGE=$folder.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$folder.tar.gz" "$folder"
            echo "PACKAGE=$folder.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.PACKAGE }}
          retention-days: 7

      - name: Add to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$PACKAGE" --clobber --repo "${{ github.repository }}"
