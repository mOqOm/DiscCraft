<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- DiscCraft's application icon (a placeholder drawn for DiscCraft): a disc on a dark tile, a menu highlight
       crossing it. Original work; MIT OR Apache-2.0. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3d57"/>
      <stop offset="1" stop-color="#121a28"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.55" stop-color="#c5cfdc"/>
      <stop offset="1" stop-color="#8b97a8"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd0ff" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#9b7bff" stop-opacity="0.35"/>
      <stop offset="0.65" stop-color="#ff7bc0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffd36b" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#tile)"/>
  <!-- The disc, its sheen and its centre. -->
  <circle cx="256" cy="256" r="188" fill="url(#disc)"/>
  <circle cx="256" cy="256" r="188" fill="url(#sheen)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="256" cy="256" r="62" fill="#dfe5ee" stroke="#7d8898" stroke-width="4"/>
  <circle cx="256" cy="256" r="24" fill="#121a28"/>
  <!-- A menu button's highlight frame over the disc, with a play mark. -->
  <rect x="300" y="318" width="164" height="104" rx="22" fill="#121a28" fill-opacity="0.82" stroke="#5fd0ff" stroke-width="10"/>
  <path d="M362 346 L362 394 L404 370 Z" fill="#5fd0ff"/>
</svg>
